<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WCW CRM | Edge Case Test Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --secondary: #a855f7;
            --secondary-glow: rgba(168, 85, 247, 0.5);
            --accent: #22d3ee;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(34, 211, 238, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.6;
        }

        h1, h2, h3, h4 {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.02em;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .badge {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: inline-block;
            margin-bottom: 1rem;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 1.5rem;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            display: block;
            margin-bottom: 0.25rem;
            color: var(--accent);
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-input {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 1rem 1.5rem 1rem 3rem;
            border-radius: 1rem;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: #4f46e5;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-dim);
        }

        /* Module Sections */
        .module-section {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            margin-bottom: 2rem;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .module-header {
            padding: 1.5rem 2rem;
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid var(--glass-border);
        }

        .module-title-wrapper {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .module-icon {
            width: 40px;
            height: 40px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .module-info h3 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .module-progress {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .progress-bar-container {
            width: 150px;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            min-width: 45px;
        }

        .module-content {
            padding: 1.5rem 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            display: none; /* Hidden by default */
        }

        .module-section.active .module-content {
            display: grid;
        }

        .test-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            padding: 1rem;
            border-radius: 1rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .test-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
        }

        .test-item.checked {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--glass-border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .test-item.checked .checkbox {
            background: var(--success);
            border-color: var(--success);
        }

        .checkbox svg {
            color: #fff;
            width: 14px;
            height: 14px;
            display: none;
        }

        .test-item.checked .checkbox svg {
            display: block;
        }

        .test-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .test-item.checked .test-text {
            color: var(--success);
            text-decoration: line-through;
            opacity: 0.8;
        }

        /* Footer */
        footer {
            margin-top: 4rem;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.9rem;
            padding-bottom: 2rem;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .module-content { grid-template-columns: 1fr; }
            .controls { flex-direction: column; align-items: stretch; }
            .search-wrapper { max-width: none; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <span class="badge">Advanced QA Testing</span>
            <h1>Edge Case Tracker</h1>
            <p class="subtitle">Comprehensive verification matrix for 150+ system edge cases and boundary conditions.</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-value" id="total-progress">0%</span>
                <span class="stat-label">Total Progress</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="completed-count">0</span>
                <span class="stat-label">Completed Cases</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="total-count">150+</span>
                <span class="stat-label">Total Test Cases</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="modules-count">18</span>
                <span class="stat-label">Active Modules</span>
            </div>
        </div>

        <div class="controls">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="search" placeholder="Search test cases...">
            </div>
            <div class="btn-group">
                <button class="btn btn-outline" onclick="resetAll()">
                    <span>🔄</span> Reset All
                </button>
                <button class="btn btn-primary" onclick="exportData()">
                    <span>📤</span> Export CSV
                </button>
            </div>
        </div>

        <div id="modules-container">
            <!-- Modules will be injected here -->
        </div>

        <footer>
            <p>WCW CRM QA Documentation &bull; v2.0 &bull; &copy; 2026</p>
        </footer>
    </div>

    <script>
        const moduleData = [
            {
                id: 'auth',
                name: '1. Authentication',
                icon: '🔑',
                cases: [
                    'Very long email (1000+ chars) - reject or trim',
                    'Special characters in email - validate format',
                    'Rapid login attempts - rate limit check',
                    'Simultaneous logins from multiple locations',
                    'Login with expired credentials - reject',
                    'Case-insensitive email handling',
                    'Logout clears all session data',
                    'Session timeout after inactivity (30+ mins)',
                    'Token manipulation - reject invalid JWT',
                    'Logout during active API request - cancellation',
                    'Logout with unsaved form data - warning prompt'
                ]
            },
            {
                id: 'dashboard',
                name: '2. Dashboard',
                icon: '📊',
                cases: [
                    'Dashboard with no data - placeholder check',
                    'Extreme large datasets (10k+ records) - pagination',
                    'Switching regions rapidly - debouncing check',
                    'Network offline - cached data display',
                    'Permissions change while viewing - live refresh',
                    'Filter combination with 0 results handling',
                    'Invalid date range input in filters',
                    'Refresh with network latency (3s+ simulation)'
                ]
            },
            {
                id: 'customers',
                name: '3. Customers',
                icon: '👥',
                cases: [
                    'Search with special characters (@, #, %)',
                    'Search with very long query (500+ chars)',
                    'Sort with null/empty value handling',
                    'Export 10,000+ customers - memory check',
                    'Create with very long company name (255+ chars)',
                    'International phone number format validation',
                    'Duplicate email rejection per organization',
                    'Form cancel prompt for unsaved changes',
                    'Edit customer while another user is editing',
                    'Delete customer with 1000+ related records'
                ]
            },
            {
                id: 'contacts',
                name: '4. Contacts',
                icon: '📇',
                cases: [
                    'Contact without email/phone - display handling',
                    'Contact associated with deleted customer',
                    'Bulk operations on 1000+ contacts',
                    'Duplicate email per customer/target check',
                    'Primary contact toggle - single primary enforcement',
                    'Contact role assignment - multiple role handling',
                    'Delete last contact for a major customer'
                ]
            },
            {
                id: 'opportunities',
                name: '5. Opportunities',
                icon: '💰',
                cases: [
                    'Opportunity with $0 amount handling',
                    'Extremely large amount (999,999,999) display',
                    'Probability > 100% or < 0% validation',
                    'Expected close date in the past handling',
                    'Drag-drop between pipeline stages validation',
                    'Edit closed/won opportunity restrictions',
                    'Revenue recognition on "Won" status'
                ]
            },
            {
                id: 'tasks',
                name: '6. Tasks',
                icon: '✅',
                cases: [
                    'Task without due date display',
                    'Overdue task highlighting and alerts',
                    'Task assigned to multiple users (team task)',
                    'Create task with 10,000 character description',
                    'Edit closed task - lock check',
                    'Delete task with related activity notes'
                ]
            },
            {
                id: 'commitments',
                name: '7. Commitments',
                icon: '🤝',
                cases: [
                    'Commitment spanning multiple fiscal years',
                    'List view with 10,000+ active commitments',
                    'Past due commitment alert trigger',
                    'Marking already completed commitment again',
                    'Completion date validation (cannot be future)'
                ]
            },
            {
                id: 'calendar',
                name: '8. Calendar',
                icon: '📅',
                cases: [
                    'Leap year (Feb 29) display and logic',
                    'Daylight Savings Time (DST) transition handling',
                    'Overlapping meetings conflict detection',
                    'All-day event rendering in grid',
                    'Calendar view in different timezones'
                ]
            },
            {
                id: 'schedule',
                name: '9. Schedule',
                icon: '⏰',
                cases: [
                    'Overlapping time slots validation',
                    'Recurring event series management',
                    'Day view vs Week view data consistency',
                    'Assigning schedule entry to another rep'
                ]
            },
            {
                id: 'targets',
                name: '10. Targets',
                icon: '🎯',
                cases: [
                    'Target with $0 goal amount',
                    'Over-target (100%+) progress bar display',
                    'Historical target viewing (past periods)',
                    'Retroactive target amount modification',
                    'Import prospect file with invalid formats',
                    'Network interruption during large import'
                ]
            },
            {
                id: 'alerts',
                name: '11. Daily Alerts',
                icon: '🔔',
                cases: [
                    'Large alert volume (1000+) performance',
                    'Stale alerts (10+ days old) auto-archival',
                    'Snooze alert then immediate dismiss',
                    'Re-alert trigger after snooze period expires'
                ]
            },
            {
                id: 'settings',
                name: '12. Global Settings',
                icon: '⚙️',
                cases: [
                    'Large configuration set (1000+ fields)',
                    'Conflicting settings validation logic',
                    'Invalid type input for numeric settings',
                    'Settings update sync across active sessions'
                ]
            },
            {
                id: 'regions',
                name: '13. Regions',
                icon: '🌎',
                cases: [
                    'Region with 1000+ team members load',
                    'Delete region with active customers',
                    'Reassigning members during region deletion',
                    'Region overlap check for territories'
                ]
            },
            {
                id: 'groups',
                name: '14. Groups',
                icon: '👨‍👩‍👧‍👦',
                cases: [
                    'Delete group with 1000+ active members',
                    'Concurrent member additions to same group',
                    'Empty group display and removal logic',
                    'Group name uniqueness check'
                ]
            },
            {
                id: 'users',
                name: '15. User Management',
                icon: '👤',
                cases: [
                    'List view with 10,000+ active users',
                    'Create user with duplicate email/username',
                    'Self-role modification restrictions',
                    'Deactivate user with 50+ pending tasks',
                    'Granting permissions to self escalation'
                ]
            },
            {
                id: 'impersonation',
                name: '17. Access Control',
                icon: '🎭',
                cases: [
                    'Impersonate rep from another region (blocker)',
                    'Verify "Done by" tag on all created items',
                    'Activity log link verification from tag',
                    'Accessing global settings during impersonation',
                    'Target rep data modification during session'
                ]
            }
        ];

        let state = JSON.parse(localStorage.getItem('edgeCaseTracker')) || {};

        function init() {
            const container = document.getElementById('modules-container');
            container.innerHTML = '';

            moduleData.forEach(module => {
                const section = document.createElement('div');
                section.className = 'module-section';
                section.id = `module-${module.id}`;

                const completed = module.cases.filter(c => state[`${module.id}-${c}`]).length;
                const percent = Math.round((completed / module.cases.length) * 100) || 0;

                section.innerHTML = `
                    <div class="module-header" onclick="toggleModule('${module.id}')">
                        <div class="module-title-wrapper">
                            <div class="module-icon">${module.icon}</div>
                            <div class="module-info">
                                <h3>${module.name}</h3>
                            </div>
                        </div>
                        <div class="module-progress">
                            <div class="progress-bar-container">
                                <div class="progress-bar-fill" style="width: ${percent}%"></div>
                            </div>
                            <span class="progress-text">${percent}%</span>
                        </div>
                    </div>
                    <div class="module-content">
                        ${module.cases.map(caseText => {
                            const isChecked = state[`${module.id}-${caseText}`];
                            return `
                                <div class="test-item ${isChecked ? 'checked' : ''}" onclick="toggleCase('${module.id}', '${caseText.replace(/'/g, "\\'")}')">
                                    <div class="checkbox">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                    </div>
                                    <span class="test-text">${caseText}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                container.appendChild(section);
            });

            updateStats();
        }

        function toggleModule(id) {
            const section = document.getElementById(`module-${id}`);
            section.classList.toggle('active');
        }

        function toggleCase(moduleId, caseText) {
            const key = `${moduleId}-${caseText}`;
            state[key] = !state[key];
            localStorage.setItem('edgeCaseTracker', JSON.stringify(state));
            init(); // Re-render to update UI and progress
        }

        function updateStats() {
            let totalCases = 0;
            let completedCases = 0;

            moduleData.forEach(m => {
                totalCases += m.cases.length;
                completedCases += m.cases.filter(c => state[`${m.id}-${c}`]).length;
            });

            const percent = Math.round((completedCases / totalCases) * 100) || 0;
            
            document.getElementById('total-progress').innerText = `${percent}%`;
            document.getElementById('completed-count').innerText = completedCases;
            document.getElementById('total-count').innerText = totalCases;
        }

        function resetAll() {
            if (confirm('Are you sure you want to reset all progress?')) {
                state = {};
                localStorage.removeItem('edgeCaseTracker');
                init();
            }
        }

        function exportData() {
            let csv = 'Module,Test Case,Status\n';
            moduleData.forEach(m => {
                m.cases.forEach(c => {
                    const status = state[`${m.id}-${c}`] ? 'PASSED' : 'PENDING';
                    csv += `"${m.name}","${c}","${status}"\n`;
                });
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `wcw-edge-cases-${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Search functionality
        document.getElementById('search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.test-item');
            
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                if (text.includes(term)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });

            // Expand modules that have visible items
            moduleData.forEach(m => {
                const section = document.getElementById(`module-${m.id}`);
                const hasVisible = Array.from(section.querySelectorAll('.test-item')).some(i => i.style.display === 'flex');
                if (term && hasVisible) {
                    section.classList.add('active');
                } else if (!term) {
                    // Reset to collapsed if search is cleared (optional)
                }
            });
        });

        init();
    </script>
</body>
</html>
