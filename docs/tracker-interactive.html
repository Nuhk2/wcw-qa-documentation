<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WCW CRM | QA Execution Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --secondary: #a855f7;
            --secondary-glow: rgba(168, 85, 247, 0.5);
            --accent: #22d3ee;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .badge {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: inline-block;
            margin-bottom: 1rem;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle { color: var(--text-dim); font-size: 1.1rem; }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 1.25rem;
            text-align: center;
        }

        .stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            display: block;
        }

        .stat-label { color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase; }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { box-shadow: 0 0 15px var(--primary-glow); }
        .btn-outline { background: transparent; border: 1px solid var(--glass-border); color: #fff; }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }

        /* Module */
        .module-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 1.25rem;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .module-header {
            padding: 1.25rem 1.5rem;
            background: rgba(255,255,255,0.02);
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }

        .module-content {
            display: none;
            padding: 1.5rem;
            border-top: 1px solid var(--glass-border);
        }

        .module-card.active .module-content { display: block; }

        .checklist { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0.75rem; }

        .check-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--glass-border);
            padding: 1rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .check-item:hover { border-color: var(--primary); background: rgba(255,255,255,0.05); }
        .check-item.checked { border-color: var(--success); background: rgba(16, 185, 129, 0.05); }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--glass-border);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .check-item.checked .checkbox { background: var(--success); border-color: var(--success); }
        .checkbox svg { width: 12px; height: 12px; color: #fff; display: none; }
        .check-item.checked .checkbox svg { display: block; }

        .item-text { font-size: 0.9rem; font-weight: 500; }
        .check-item.checked .item-text { color: var(--success); text-decoration: line-through; opacity: 0.7; }

        /* Sign-off */
        .sign-off {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 2rem;
            border-radius: 1.25rem;
            margin-top: 3rem;
        }

        .sign-off h3 { margin-bottom: 1.5rem; font-family: 'Outfit'; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; }

        .field { display: flex; flex-direction: column; gap: 0.5rem; }
        .field label { font-size: 0.75rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; }
        .field input, .field textarea {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            padding: 0.85rem;
            border-radius: 0.5rem;
            color: #fff;
            outline: none;
        }

        .field input:focus { border-color: var(--primary); }

        footer { text-align: center; margin-top: 4rem; color: var(--text-dim); font-size: 0.85rem; padding-bottom: 2rem; }

        .notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--primary);
            color: #fff;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <span class="badge">Standard QA Checklist</span>
            <h1>QA Execution Tracker</h1>
            <p class="subtitle">Core functional verification and system role audit checklist.</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card"><span class="stat-value" id="percent">0%</span><span class="stat-label">Completion</span></div>
            <div class="stat-card"><span class="stat-value" id="done-count">0</span><span class="stat-label">Verified</span></div>
            <div class="stat-card"><span class="stat-value" id="todo-count">0</span><span class="stat-label">Pending</span></div>
            <div class="stat-card"><span class="stat-value" id="roles-count">0/4</span><span class="stat-label">Roles</span></div>
        </div>

        <div class="controls">
            <div style="display:flex; gap:0.5rem">
                <button class="btn btn-primary" id="export-csv">Export CSV</button>
                <button class="btn btn-outline" id="print-pdf">Print PDF</button>
            </div>
            <button class="btn btn-outline" id="reset-all">Reset All</button>
        </div>

        <div id="tracker-body"></div>

        <div class="sign-off">
            <h3>✍️ Sign-Off & Roles</h3>
            <div class="checklist" id="roles-body" style="margin-bottom: 2rem;"></div>
            
            <div class="form-grid">
                <div class="field"><label>QA Manager</label><input type="text" id="qa-mgr"></div>
                <div class="field"><label>Tech Lead</label><input type="text" id="tech-lead"></div>
                <div class="field"><label>Date</label><input type="date" id="so-date"></div>
                <div class="field" style="grid-column: 1/-1;"><label>Notes</label><textarea id="so-notes"></textarea></div>
            </div>
        </div>

        <div class="notification" id="notif"></div>

        <footer>
            <p>WCW CRM QA Documentation &bull; &copy; 2026</p>
        </footer>
    </div>

    <script>
        const trackerData = {
            credentials: [
                { id: 'cred1', text: 'Create Admin test user' },
                { id: 'cred2', text: 'Create Manager test user' },
                { id: 'cred3', text: 'Create Sales Rep test user' },
                { id: 'cred4', text: 'Create Inside Rep test user' },
                { id: 'cred5', text: 'Verify all logins work' },
            ],
            modules: [
                { name: '0. System Roles Audit', items: ['Admin: Global Scope', 'Manager: Global Scope', 'Inside Rep: Global Scope', 'Sales Rep: Restricted Scope', 'Admin: User CRUD', 'Manager: View Users Only'] },
                { name: '1. Authentication', items: ['Login form displays', 'All 4 roles login', 'Session persists', 'Logout clears data', 'Invalid login rejected'] },
                { name: '2. Dashboard', items: ['Admin sees all', 'Manager sees team', 'Sales Rep sees own', 'Inside Rep sees all', 'Filters work'] },
                { name: '3. Customers', items: ['View list', 'Create customer', 'Edit customer', 'Delete permissions', 'Search/filter'] },
                { name: '4. Contacts', items: ['View list', 'Create contact', 'Edit by ownership', 'Delete restricted', 'Target association'] },
                { name: '5. Opportunities', items: ['Pipeline view', 'Create opp', 'Edit by ownership', 'Won/Lost status', 'Delete restricted'] },
                { name: '6. Tasks', items: ['Admin all tasks', 'Manager team tasks', 'Sales Rep own only', 'Create/complete', 'Delete restricted'] },
                { name: '7. Commitments', items: ['View by role', 'Create works', 'Edit works', 'Mark complete', 'Type field'] },
                { name: '8. Calendar', items: ['BLOCKER: Mock data', 'Navigate months', 'Create meeting', 'Mobile view'] },
                { name: '9. Schedule', items: ['Conflict check', 'Conflict warnings', 'Recurring events', 'Sales Rep own only'] },
                { name: '10. Targets', items: ['View by role', 'Create/edit restricted', 'Import Prospects flow'] },
                { name: '11. Daily Alerts', items: ['View by role', 'Dismiss/snooze', 'Badge count'] },
                { name: '12. Global Settings', items: ['Admin full access', 'Manager limited', 'Sales Rep blocked'] },
                { name: '13. Regions', items: ['Regional filtering', 'Manager restricted', 'Cross-region hidden'] },
                { name: '14. Groups', items: ['Manager create', 'Add/Remove members', 'Delete group'] },
                { name: '15. User Management', items: ['Admin view all', 'Admin create users', 'Manager view only'] },
                { name: '16. Layout', items: ['Navigation menu', 'Role filtering', 'Mobile responsive'] },
                { name: '17. Impersonation', items: ['Rep Selection scope', 'Actions as Rep', 'Done by tag logging'] },
                { name: '18. Global View', items: ['Org-level visibility', 'Global settings restriction'] }
            ],
            roles: [
                { id: 'admin', text: '👨‍💼 Admin Verified' },
                { id: 'manager', text: '👔 Manager Verified' },
                { id: 'salesrep', text: '📱 Sales Rep Verified' },
                { id: 'insiderep', text: '🏢 Inside Rep Verified' }
            ]
        };

        let state = JSON.parse(localStorage.getItem('wcwInteractiveTracker')) || {};

        function init() {
            render();
            updateStats();
        }

        function render() {
            const body = document.getElementById('tracker-body');
            body.innerHTML = '';

            // Credentials
            const credCard = createModule('🔑 Test Credentials', trackerData.credentials.map(c => c.text), 'cred');
            body.appendChild(credCard);

            // Modules
            trackerData.modules.forEach((m, i) => {
                body.appendChild(createModule(m.name, m.items, `m${i}`));
            });

            // Roles
            const rolesBody = document.getElementById('roles-body');
            rolesBody.innerHTML = trackerData.roles.map(r => `
                <div class="check-item ${state[`role-${r.id}`] ? 'checked' : ''}" onclick="toggle('role-${r.id}')">
                    <div class="checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                    <span class="item-text">${r.text}</span>
                </div>
            `).join('');

            // Fields
            ['qa-mgr', 'tech-lead', 'so-date', 'so-notes'].forEach(id => {
                document.getElementById(id).value = state[id] || '';
            });
        }

        function createModule(name, items, prefix) {
            const div = document.createElement('div');
            div.className = `module-card ${state[`${prefix}-exp`] ? 'active' : ''}`;
            div.innerHTML = `
                <div class="module-header" onclick="toggleExp('${prefix}')">
                    <span style="font-weight:700">${name}</span>
                    <span>${state[`${prefix}-exp`] ? '▲' : '▼'}</span>
                </div>
                <div class="module-content">
                    <div class="checklist">
                        ${items.map((item, i) => {
                            const key = `${prefix}-i${i}`;
                            return `
                                <div class="check-item ${state[key] ? 'checked' : ''}" onclick="toggle('${key}')">
                                    <div class="checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                                    <span class="item-text">${item}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
            return div;
        }

        function toggle(key) { state[key] = !state[key]; save(); init(); }
        function toggleExp(prefix) { state[`${prefix}-exp`] = !state[`${prefix}-exp`]; save(); init(); }
        function save() { localStorage.setItem('wcwInteractiveTracker', JSON.stringify(state)); }

        function updateStats() {
            let total = 0, checked = 0;
            trackerData.credentials.forEach((_, i) => { total++; if(state[`cred-i${i}`]) checked++; });
            trackerData.modules.forEach((m, mi) => {
                m.items.forEach((_, ii) => { total++; if(state[`m${mi}-i${ii}`]) checked++; });
            });
            const percent = Math.round((checked / total) * 100) || 0;
            document.getElementById('percent').innerText = percent + '%';
            document.getElementById('done-count').innerText = checked;
            document.getElementById('todo-count').innerText = total - checked;
            const roles = trackerData.roles.filter(r => state[`role-${r.id}`]).length;
            document.getElementById('roles-count').innerText = `${roles}/4`;
        }

        ['qa-mgr', 'tech-lead', 'so-date', 'so-notes'].forEach(id => {
            document.getElementById(id).oninput = (e) => { state[id] = e.target.value; save(); };
        });

        document.getElementById('export-csv').onclick = () => {
            let csv = 'Module,Item,Status\n';
            trackerData.modules.forEach((m, mi) => {
                m.items.forEach((item, ii) => {
                    csv += `"${m.name}","${item}","${state[`m${mi}-i${ii}`] ? 'DONE' : 'PENDING'}"\n`;
                });
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'qa-tracker-results.csv';
            a.click();
        };

        document.getElementById('print-pdf').onclick = () => window.print();
        document.getElementById('reset-all').onclick = () => { if(confirm('Reset all?')) { state = {}; save(); init(); } };

        init();
    </script>
</body>
</html>
